<header>
    <h2>お問い合わせフォーム</h2>
</header>

<aside>

<form action="confirm.php" method="post" onsubmit="return checkForm();">

<table border="3">
    <tr>
        <th>お名前</th>
        <td>
            <input type="text" id="name" name="name" size="40">
        </td>
    </tr>
    
    <tr>
        <th>会社名</th>
        <td>
            <input type="text" id="companyName" name="company" size="40">
        </td>
    </tr>

        <td>
            <input type="email" id="email" name="email" size="40">

    <tr>
        <th>年齢</th>
        <td>
            <input type="number" id="age" name="age">
        </td>

        <th>問い合わせ内容</th>
        <td>
